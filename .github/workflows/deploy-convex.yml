name: Deploy Seed Convex

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-seed-convex-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.SEED_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.SEED_CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:convex
      - run: bunx convex deploy
